services:
  - type: web
    name: lionstock-frontend
    region: southamerica-east1
    rootDir: frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://lionstock.onrender.com
